version: '3.8'

services:
  app:
    build: .
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=chessinchunks
      - NODE_ENV="development"
      - PORT='5000'
      - INVITATION_SECRET=''
    depends_on:
      - mysql
    networks:
      - app-network

  mysql:
  image: mysql:8.0
  environment:
    - MYSQL_ROOT_PASSWORD=b14ck-cyph3R
    - MYSQL_DATABASE=chessinchunks
    - MYSQL_USER=root
    - MYSQL_PASSWORD=password
  volumes:
    - mysql-data:/var/lib/mysql
  networks:
    - app-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    volumes:
      - ./cloudflared:/home/nonroot/.cloudflared
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
